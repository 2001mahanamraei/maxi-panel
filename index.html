<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maxi Panel | پنل ماکسی</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="container">
    <header>
      <div>
        <h1>⚡ ماکسی پنل</h1>
        <p>مدیریت کاربران، اشتراک‌ها و کانفیگ‌ها</p>
      </div>
      <button id="logoutBtn" class="danger">خروج</button>
    </header>

    <section id="loginBox" class="card">
      <h2>ورود مدیر</h2>
      <p>توکن ادمین Cloudflare Worker را وارد کن.</p>
      <input id="adminToken" type="password" placeholder="ADMIN_TOKEN" />
      <button id="loginBtn">ورود به پنل</button>
    </section>

    <section id="dashboard" hidden>
      <div class="card">
        <h2>ساخت کاربر جدید</h2>

        <div class="grid">
          <input id="username" placeholder="نام کاربر" />
          <input id="expiresAt" type="datetime-local" />
        </div>

        <label class="label">کانفیگ V2Ray / Xray</label>
        <textarea id="v2rayConfig" placeholder="vmess:// یا vless:// یا trojan://"></textarea>

        <label class="label">کانفیگ WireGuard</label>
        <textarea id="wireguardConfig" placeholder="[Interface] ..."></textarea>

        <button id="createUserBtn">ساخت کاربر</button>
      </div>

      <section class="card">
        <div class="section-title">
          <h2>کاربران</h2>
          <button id="refreshBtn" class="secondary">بروزرسانی</button>
        </div>

        <div id="usersList" class="users-list"></div>
      </section>
    </section>
  </main>

  <div id="toast"></div>

  <script src="./app.js"></script>
</body>
</html>
